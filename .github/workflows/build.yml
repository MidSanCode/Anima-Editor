name: Build Anima Editor

# 手动触发（与参考工程 openfield-app 一致）。六个平台各自独立开关，默认只出
# Windows —— 一次全开会把 CI 额度烧得很快，按需勾选即可。
on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: false
      build_macos:
        description: 'macOS (x64/ARM)'
        type: boolean
        default: false
      build_android:
        description: 'Android (APK)'
        type: boolean
        default: false
      build_ios:
        description: 'iOS (IPA)'
        type: boolean
        default: false
      build_web:
        description: 'Web'
        type: boolean
        default: false
      run_tests:
        description: '先跑 flutter analyze + test'
        type: boolean
        default: true

      # 勾选后把各平台**构建成功**的压缩包发布到 GitHub Releases。
      # 标题与 tag 都用「版本号+构建数字」（如 0.1.0+1）；已存在的同名资产
      # 会自动跳过，所以重复发布会补齐缺失的那些，不会报错。
      publish_release:
        description: '发布到 Releases（上传各平台压缩包）'
        type: boolean
        default: false

# 同一分支只保留最新一次构建，避免排队堆积。
concurrency:
  group: build-editor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 钉住 Flutter 版本：构建产物可复现，也不会被上游 stable 更新悄悄改行为。
  # 仓库本地开发用的就是 3.44.4（Dart SDK ^3.12.2）。
  FLUTTER_VERSION: '3.44.4'

  # 引擎产物地址（可选）。引擎在**另一个仓库**里，本仓库的包默认**不含**引擎；
  # 此时应用自动降级到内置实现（功能完整、不崩溃，见
  # lib/core/engine/engine_bootstrap.dart）。想让产物带上真引擎，在仓库
  # Settings → Variables 里配置下面任一项即可，构建时自动注入：
  #
#   ENGINE_URL          【推荐】一个地址搞定所有平台，指到引擎的合集包 zip
#   ENGINE_WINDOWS_URL  桌面，指到 anima.dll（裸文件 / 单平台 zip / 合集包都行）
#   ENGINE_LINUX_URL    Linux，指到 libanima.so
#   ENGINE_MACOS_URL    macOS，指到 libanima.dylib
#   ENGINE_ANDROID_URL  Android，指到 .aar
#   ENGINE_IOS_URL      iOS，指到内含 anima.xcframework 的 .zip
#   ENGINE_WEB_URL      Web，指到 wasm-bindgen 的 .zip（anima_wasm.js + _bg.wasm）
  #
  # **只配 ENGINE_URL 一个就够**（推荐）：它指向引擎发的合集包，里面按
  # windows/ linux/ macos/ android/ ios/ web/ 分目录放着各平台产物；每个
  # 构建作业只从里面取自己平台需要的那几个文件，取不到就响亮报错。
  # 单独配置优先级更高：配了 ENGINE_*_URL 的平台用它，其余平台回落 ENGINE_URL。
  #
  # 引擎仓库勾选 publish_release 后会按固定名字发布资产，于是可以直接写死
  # 「永远指向最新发布」的地址，不用每换个版本就改 URL。合集包：
  #   https://github.com/midsancode/anima-engine/releases/latest/download/anima-engine-all.zip
  # 只想单独配某个平台时，用这些（资产名同下划线那个变量的含义）：
  #   anima-engine-windows-x64.zip / anima-engine-linux-x64.tar.gz
  #   anima-engine-macos-universal.tar.gz / anima-engine-android.aar
  #   anima-engine-ios.xcframework.zip / anima-engine-web.zip
  ENGINE_URL: ${{ vars.ENGINE_URL }}
  ENGINE_WINDOWS_URL: ${{ vars.ENGINE_WINDOWS_URL }}
  ENGINE_LINUX_URL: ${{ vars.ENGINE_LINUX_URL }}
  ENGINE_MACOS_URL: ${{ vars.ENGINE_MACOS_URL }}
  ENGINE_ANDROID_URL: ${{ vars.ENGINE_ANDROID_URL }}
  ENGINE_IOS_URL: ${{ vars.ENGINE_IOS_URL }}
  ENGINE_WEB_URL: ${{ vars.ENGINE_WEB_URL }}

jobs:
  # 先跑测试再打包：把「代码坏了」挡在制品之前。
  # 注意工作目录是仓库根（不是子目录），因为 editor/ 自身就是一个 git 仓库。
  verify:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded

  windows:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: ').Line.Split(': ')[-1].Trim()
          $parts = $ver.Split('+')
          "BUILD_NAME=$($parts[0])"   >> $env:GITHUB_ENV
          "BUILD_NUMBER=$($parts[1])" >> $env:GITHUB_ENV
      - name: Write build config
        shell: pwsh
        run: |
          # 应用内「关于」读的是这些 define（lib/core/platform/app_info.dart）。
          # 用 --dart-define-from-file 而不是改仓库文件：同一次提交能产出
          # 不同构建号的包，仓库保持干净。
          @{
            BUILD_VERSION = "$env:BUILD_NAME"
            BUILD_NUMBER  = "$env:BUILD_NUMBER"
          } | ConvertTo-Json -Compress | Set-Content config.json -Encoding utf8
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build windows --release --build-name=$env:BUILD_NAME --build-number=$env:BUILD_NUMBER --dart-define-from-file=config.json
      - name: Inject engine (optional)
        # 地址优先用 ENGINE_WINDOWS_URL；没配就用合集包 ENGINE_URL。
        # 三种来源都认：合集包（按目录结构取 windows/anima.dll）、
        # 单平台包（按文件名取）、裸 anima.dll。
        if: ${{ env.ENGINE_WINDOWS_URL != '' || env.ENGINE_URL != '' }}
        shell: pwsh
        run: |
          $url = if ($env:ENGINE_WINDOWS_URL) { $env:ENGINE_WINDOWS_URL } else { $env:ENGINE_URL }
          $tmp = Join-Path $env:RUNNER_TEMP "anima-engine"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $file = Join-Path $tmp "download.bin"
          Invoke-WebRequest -Uri $url -OutFile $file
          $bytes = [IO.File]::ReadAllBytes($file)
          $dll = $null
          if ($bytes.Length -gt 4 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
            # ZIP：合集包在 windows/ 下，单平台包在根。先找前者，再退回「任何位置」。
            $zip = Join-Path $tmp "engine.zip"
            Move-Item $file $zip -Force
            Expand-Archive -Path $zip -DestinationPath $tmp -Force
            $dll = Get-ChildItem $tmp -Recurse -Filter anima.dll -File |
                   Where-Object { $_.DirectoryName -match 'windows$' } |
                   Select-Object -First 1
            if (-not $dll) {
              $dll = Get-ChildItem $tmp -Recurse -Filter anima.dll -File | Select-Object -First 1
            }
          } elseif ($bytes.Length -gt 2 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
            # 裸动态库（PE 以 MZ 开头）：下载下来的就是它本身。
            $dll = Get-Item $file
          } else {
            # 既不是 zip 也不是 PE —— 多半是 404 页面。必须挡下：装一个坏 dll
            # 进去，应用只会在运行期静默降级，问题极难排查。
            throw "既不是 zip 也不是 PE 动态库（前 2 字节不是 MZ）：$url"
          }
          if (-not $dll) { throw "在 $url 里找不到 anima.dll" }
          # 引擎查找顺序包含「exe 同级目录」（ffi_am_engine_io.dart），放这里即可。
          $dest = "build\windows\x64\runner\Release"
          Copy-Item $dll.FullName (Join-Path $dest "anima.dll") -Force
          Write-Host "injected $($dll.FullName)"
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath anima-editor-windows-$env:BUILD_NAME-portable.zip
      - name: Build installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          # 安装器是「锦上添花」：装不上 Inno Setup 也不该让整条流水线失败。
          choco install innosetup --no-progress -y
          $name = "赋灵 Anima Editor"
          $iss = @"
          [Setup]
          AppName=$name
          AppVersion=$env:BUILD_NAME
          DefaultDirName={autopf}\Anima Editor
          DefaultGroupName=$name
          OutputDir=installer_output
          OutputBaseFilename=anima-editor-setup-$env:BUILD_NAME
          UninstallDisplayIcon={app}\anima_editor.exe
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          "@
          $iss | Out-File setup.iss -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: anima-editor-Windows-portable
          path: anima-editor-windows-${{ env.BUILD_NAME }}-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('installer_output/*.exe') != '' }}
        with:
          name: anima-editor-Windows-installer
          path: installer_output/*.exe

  linux:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}"  >> $GITHUB_ENV
          echo "BUILD_NUMBER=${VER##*+}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Install system dependencies
        run: |
          # Flutter Linux 桌面工具链：clang/cmake/ninja/pkg-config + GTK3。
          # libsecret / libasound2 供 shared_preferences 等插件链接。
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build linux --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - name: Inject engine (optional)
        # 地址优先用 ENGINE_LINUX_URL；没配就用合集包 ENGINE_URL。
        if: ${{ env.ENGINE_LINUX_URL != '' || env.ENGINE_URL != '' }}
        run: |
          set -euo pipefail
          URL="${ENGINE_LINUX_URL:-$ENGINE_URL}"
          [ -n "$URL" ] || { echo "::error::未配置 ENGINE_LINUX_URL 也没配 ENGINE_URL"; exit 1; }
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          curl -fsSL "$URL" -o "$TMP/download.bin"
          if tar -tzf "$TMP/download.bin" >/dev/null 2>&1; then
            tar -xzf "$TMP/download.bin" -C "$TMP"
          elif unzip -qq -o "$TMP/download.bin" -d "$TMP" >/dev/null 2>&1; then
            :
          else
            # 不是归档 → 应当是裸库本身。校验 ELF 魔数，免得把 404 页面当成
            # .so 装进产物（那会让应用在运行期静默降级，问题极难排查）。
            MAGIC=$(od -An -tx1 -N4 "$TMP/download.bin" | tr -d '[:space:]')
            [ "$MAGIC" = "7f454c46" ] || { echo "::error::$URL 既不是归档也不是 ELF 动态库"; exit 1; }
            cp "$TMP/download.bin" "$TMP/libanima.so"
          fi
          # 合集包里在 linux/ 下，单平台包在根。排除 ABI 目录：Android 的
          # jni/<abi>/libanima.so 与本平台的同名，不能拿错。
          FOUND=$(find "$TMP" -name 'libanima.so' -type f \
            -not -path '*/arm64-v8a/*' -not -path '*/armeabi-v7a/*' \
            -not -path '*/x86_64/*' -not -path '*/x86/*' -print -quit)
          [ -n "$FOUND" ] || { echo "::error::在 $URL 里找不到 Linux 的 libanima.so"; exit 1; }
          # 放到 bundle/lib/：引擎会在 exe 同级与 exe/lib 下查找。
          mkdir -p build/linux/x64/release/bundle/lib
          cp "$FOUND" build/linux/x64/release/bundle/lib/libanima.so
          echo "injected $FOUND"
      - name: Package tarball
        run: tar -czf anima-editor-linux-${{ env.BUILD_NAME }}.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: anima-editor-Linux
          path: anima-editor-linux-${{ env.BUILD_NAME }}.tar.gz
          if-no-files-found: error

  macos:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}"  >> $GITHUB_ENV
          echo "BUILD_NUMBER=${VER##*+}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build macos --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - name: Inject engine (optional)
        # 地址优先用 ENGINE_MACOS_URL；没配就用合集包 ENGINE_URL。
        if: ${{ env.ENGINE_MACOS_URL != '' || env.ENGINE_URL != '' }}
        run: |
          set -euo pipefail
          URL="${ENGINE_MACOS_URL:-$ENGINE_URL}"
          [ -n "$URL" ] || { echo "::error::未配置 ENGINE_MACOS_URL 也没配 ENGINE_URL"; exit 1; }
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          curl -fsSL "$URL" -o "$TMP/download.bin"
          if tar -tzf "$TMP/download.bin" >/dev/null 2>&1; then
            tar -xzf "$TMP/download.bin" -C "$TMP"
          elif unzip -qq -o "$TMP/download.bin" -d "$TMP" >/dev/null 2>&1; then
            :
          else
            # 不是归档 → 应当是裸库本身。校验 Mach-O 魔数（含 universal），
            # 免得把 404 页面当成 .dylib 装进产物。
            MAGIC=$(od -An -tx1 -N4 "$TMP/download.bin" | tr -d '[:space:]')
            case "$MAGIC" in
              cffaedfe|cefaedfe|cafebabe|bebafeca) ;;
              *) echo "::error::$URL 既不是归档也不是 Mach-O 动态库"; exit 1 ;;
            esac
            cp "$TMP/download.bin" "$TMP/libanima.dylib"
          fi
          # 合集包里在 macos/ 下，单平台包在根。
          FOUND=$(find "$TMP" -name 'libanima.dylib' -type f -print -quit)
          [ -n "$FOUND" ] || { echo "::error::在 $URL 里找不到 libanima.dylib"; exit 1; }
          # 先解析出真实 .app 名（不写死产物名）。Contents/MacOS/ 是 dyld 内置
          # 加载器实际查的目录；Contents/Frameworks/ 则覆盖走 @rpath 的情形。
          APP_DIR=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -type d -print -quit)
          [ -n "$APP_DIR" ] || { echo "::error::没找到 .app 产物"; exit 1; }
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Frameworks"
          cp "$FOUND" "$APP_DIR/Contents/MacOS/libanima.dylib"
          cp "$FOUND" "$APP_DIR/Contents/Frameworks/libanima.dylib"
          echo "injected $FOUND"
      - name: Package app bundle
        run: |
          cd build/macos/Build/Products/Release
          # 用 glob 匹配 *.app，而不是写死 Runner.app / anima_editor.app ——
          # 改产品名也不会把打包这一步弄坏。
          APP_NAME=$(ls -d *.app | head -n 1)
          echo "packaging $APP_NAME"
          zip -qry ../../../../../anima-editor-macos-${{ env.BUILD_NAME }}.zip "$APP_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: anima-editor-macOS
          path: anima-editor-macos-${{ env.BUILD_NAME }}.zip
          if-no-files-found: error

  android:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}"  >> $GITHUB_ENV
          echo "BUILD_NUMBER=${VER##*+}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      # 引擎原生库（可选）：下载引擎 .aar，把 jniLibs/<abi>/libanima.so 交给 AGP。
      # .aar 就是 zip；里面的 classes.jar 是空壳（引擎没有 Java API，宿主直接
      # System.loadLibrary("anima") + JNI），所以只需要 so 进 APK。
      - name: Inject engine (optional)
        # 地址优先用 ENGINE_ANDROID_URL；没配就用合集包 ENGINE_URL。
        # .aar 就是 zip；里面的 classes.jar 是空壳（引擎没有 Java API，宿主直接
        # System.loadLibrary("anima") + JNI），所以只需要 so 进 APK。
        if: ${{ env.ENGINE_ANDROID_URL != '' || env.ENGINE_URL != '' }}
        run: |
          set -euo pipefail
          URL="${ENGINE_ANDROID_URL:-$ENGINE_URL}"
          [ -n "$URL" ] || { echo "::error::未配置 ENGINE_ANDROID_URL 也没配 ENGINE_URL"; exit 1; }
          TMP="$RUNNER_TEMP/anima-android"
          rm -rf "$TMP"; mkdir -p "$TMP"
          curl -fsSL "$URL" -o "$TMP/download.bin"
          # 确认拿到的是 zip（.aar 容器），否则可能下到了 HTML 错误页。
          head -c 2 "$TMP/download.bin" | grep -q 'PK' || { echo "::error::$URL 不是 .aar/zip"; exit 1; }
          rm -rf "$TMP/x"; mkdir -p "$TMP/x"
          unzip -qq -o "$TMP/download.bin" -d "$TMP/x"
          # 合集包里 jni/ 在 android/ 下，单平台 .aar 在根；按目录找，两种都认。
          JNI=$(find "$TMP/x" -type d -name jni -print -quit)
          [ -n "$JNI" ] || { echo "::error::$URL 里没有 jni/ 目录（不是引擎 .aar）"; exit 1; }
          mkdir -p android/app/src/main/jniLibs
          cp -R "$JNI/." android/app/src/main/jniLibs/
          find android/app/src/main/jniLibs -name '*.so' | sort
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        run: |
          # key.properties 必须放在 android/（gradle 根工程），
          # 放 android/app/ 里 release 的签名配置根本不会被读到。
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - uses: actions/upload-artifact@v4
        with:
          name: anima-editor-Android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}"  >> $GITHUB_ENV
          echo "BUILD_NUMBER=${VER##*+}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Decode certificate
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        if: env.IOS_CERTIFICATE_P12 != ''
        run: |
          echo "$IOS_CERTIFICATE_P12" | base64 -d > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import certificate.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        if: env.IOS_PROVISIONING_PROFILE != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | \
            xmllint --xpath "string(//key[.='UUID']/following-sibling::string[1])" -)
          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
          echo "IOS_PROVISIONING_PROFILE_NAME=$UUID" >> $GITHUB_ENV
      - name: Set signing flag
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_TEAM_ID" ]; then
            echo "HAS_SIGNING=1" >> $GITHUB_ENV
          else
            echo "HAS_SIGNING=0" >> $GITHUB_ENV
          fi
      - name: Build IPA (unsigned)
        if: env.HAS_SIGNING == '0'
        run: |
          # 没有签名材料也要出 IPA：--no-codesign 之后手工组 Payload/ 打包。
          flutter build ios --release --no-codesign --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
          find build/ios/iphoneos/Runner.app -type f -exec sh -c 'file -b "$1" | grep -q "^Mach-O" && strip -S "$1"' _ {} \; 2>/dev/null || true
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r Runner.ipa Payload/ && cd -
      - name: Build IPA (signed)
        if: env.HAS_SIGNING == '1'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_CERTIFICATE: "Apple Distribution"
        run: flutter build ipa --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      # 引擎静态库（可选）：下载内含 anima.xcframework 的 zip，把静态库链进 Runner。
      # App Store 不允许 App 内嵌 dylib，所以 iOS 交付的是 staticlib（.a）。
      - name: Inject engine (optional)
        # 地址优先用 ENGINE_IOS_URL；没配就用合集包 ENGINE_URL。
        # App Store 不允许 App 内嵌 dylib，所以 iOS 交付的是 staticlib（.a）。
        if: ${{ env.ENGINE_IOS_URL != '' || env.ENGINE_URL != '' }}
        run: |
          set -euo pipefail
          URL="${ENGINE_IOS_URL:-$ENGINE_URL}"
          [ -n "$URL" ] || { echo "::error::未配置 ENGINE_IOS_URL 也没配 ENGINE_URL"; exit 1; }
          TMP="$RUNNER_TEMP/engine-ios"
          rm -rf "$TMP"; mkdir -p "$TMP"
          curl -fsSL "$URL" -o "$TMP/download.bin"
          head -c 2 "$TMP/download.bin" | grep -q 'PK' || { echo "::error::$URL 不是 zip"; exit 1; }
          rm -rf "$TMP/x"; mkdir -p "$TMP/x"
          unzip -qq -o "$TMP/download.bin" -d "$TMP/x"
          # 合集包里在 ios/ 下，单平台包在根。
          XCF=$(find "$TMP/x" -maxdepth 4 -name 'anima.xcframework' -type d -print -quit)
          [ -n "$XCF" ] || { echo "::error::$URL 里没有 anima.xcframework"; exit 1; }
          rm -rf ios/anima.xcframework
          cp -R "$XCF" ios/anima.xcframework
          # 静态库不像动态库那样「放进 bundle 就能加载」，必须显式链接。
          # 改 pbxproj 太脆，这里走 Runner 目标的 base configuration
          # （ios/Flutter/{Debug,Release}.xcconfig），用 SDK 条件区分设备/模拟器 slice。
          # 用 printf 拼而不是 heredoc：YAML 块标量里 heredoc 正文会被迫缩进，
          # 缩进会原样写进 xcconfig。幂等：重复注入只保留一份。
          for cfg in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig; do
            [ -f "$cfg" ] || continue
            grep -q 'ANIMA_ENGINE_BEGIN' "$cfg" && continue
            {
              printf '\n'
              printf '// ---- ANIMA_ENGINE_BEGIN（CI 注入，引擎静态库；删掉本段即恢复不带引擎）----\n'
              printf '// Rust staticlib 链接进 App 需要显式 force_load，并补上 std 依赖的系统库。\n'
              printf 'OTHER_LDFLAGS[sdk=iphoneos*] = $(inherited) -force_load "$(SRCROOT)/anima.xcframework/ios-arm64/libanima.a" -framework Security -framework CoreFoundation -liconv\n'
              printf 'OTHER_LDFLAGS[sdk=iphonesimulator*] = $(inherited) -force_load "$(SRCROOT)/anima.xcframework/ios-arm64_x86_64-simulator/libanima.a" -framework Security -framework CoreFoundation -liconv\n'
              printf '// ---- ANIMA_ENGINE_END ----\n'
            } >> "$cfg"
            echo "已给 $cfg 追加引擎链接配置"
          done
          grep -c 'ANIMA_ENGINE' ios/Flutter/*.xcconfig || true
      - uses: actions/upload-artifact@v4
        with:
          name: anima-editor-iOS
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  web:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": ""
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      # 引擎 wasm（可选）：下载 wasm-bindgen 产物，放进 web/anima_engine/，
      # flutter build 会把 web/ 下的文件原样复制进产物。
      - name: Inject engine (optional)
        # 地址优先用 ENGINE_WEB_URL；没配就用合集包 ENGINE_URL。
        # 放进 web/anima_engine/，flutter build 会把 web/ 下的文件原样复制进产物。
        if: ${{ env.ENGINE_WEB_URL != '' || env.ENGINE_URL != '' }}
        run: |
          set -euo pipefail
          URL="${ENGINE_WEB_URL:-$ENGINE_URL}"
          [ -n "$URL" ] || { echo "::error::未配置 ENGINE_WEB_URL 也没配 ENGINE_URL"; exit 1; }
          TMP="$RUNNER_TEMP/engine-web"
          rm -rf "$TMP"; mkdir -p "$TMP"
          curl -fsSL "$URL" -o "$TMP/download.bin"
          head -c 2 "$TMP/download.bin" | grep -q 'PK' || { echo "::error::$URL 不是 zip"; exit 1; }
          rm -rf "$TMP/x"; mkdir -p "$TMP/x"
          unzip -qq -o "$TMP/download.bin" -d "$TMP/x"
          # 合集包里在 web/ 下，单平台包在根。按文件名找，两种都认。
          JS=$(find "$TMP/x" -name 'anima_wasm.js' -type f -print -quit)
          BG=$(find "$TMP/x" -name 'anima_wasm_bg.wasm' -type f -print -quit)
          [ -n "$JS" ] || { echo "::error::$URL 里没有 anima_wasm.js"; exit 1; }
          [ -n "$BG" ] || { echo "::error::$URL 里没有 anima_wasm_bg.wasm"; exit 1; }
          mkdir -p web/anima_engine
          cp "$JS" "$BG" web/anima_engine/
          # loader.js 是**入库的源码**（web/anima_engine/loader.js），这里不生成：
          # 它用可捕获的动态 import 加载 wasm，缺失时静默降级，不用 CI 现场拼 JS。
          test -f web/anima_engine/loader.js || { echo "::error::缺少 web/anima_engine/loader.js"; exit 1; }
          ls -l web/anima_engine
      - name: Build web
        # --no-wasm-dry-run：跳过 wasm 兼容性扫描。Dart 侧不编译成 wasm
        # （引擎是独立的 wasm 模块，经 js_interop 调用，见
        # lib/core/engine/web_wasm_am_engine_web.dart），扫描只会顺着它一路报错。
        run: flutter build web --release --no-wasm-dry-run --dart-define-from-file=config.json
      - name: Package zip
        run: |
          cd build/web
          zip -r ../../anima-editor-web-${{ env.BUILD_NAME }}.zip .
          cd -
      - uses: actions/upload-artifact@v4
        with:
          name: anima-editor-Web
          path: anima-editor-web-${{ env.BUILD_NAME }}.zip
          if-no-files-found: error

  # 发布：把各平台**构建成功**的产物挂到 GitHub Release。
  # 勾选 publish_release 才跑；标题与 tag 都是「版本号+构建数字」（如 0.1.0+1）。
  # 已存在的同名资产跳过上传，所以重复发布会自动「补齐缺失的那个」，幂等。
  release:
    needs: [verify, windows, linux, macos, android, ios, web]
    # 触发条件：勾了发布开关，且至少勾了一个平台（否则没有任何产物可发）。
    # 用 !cancelled() 而不是 !failure()：某个平台构建失败时，仍然把**成功**的
    # 那些发出去（要的就是「成功构建的压缩包」）；失败作业本身在运行页就是红的。
    if: ${{ always() && !cancelled() && inputs.publish_release && (inputs.build_windows || inputs.build_linux || inputs.build_macos || inputs.build_android || inputs.build_ios || inputs.build_web) }}
    runs-on: ubuntu-latest
    # 建 Release 需要写权限。只给这一条作业，其余作业仍是 contents: read。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 各平台上传的 artifact 汇总到 dist/。merge-multiple 拍平目录层级，于是
      # 所有包平铺在 dist/ 下，后面按 basename 判断重名。
      # 一个产物都没有时这个 action 会报错，所以 continue-on-error，交给下一步
      # 给出更清楚的提示。
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          case "$VER" in
            *+*) VERSION="${VER%%+*}"; BUILD="${VER##*+}" ;;
            *)   VERSION="$VER";       BUILD="" ;;
          esac
          if [ -n "$BUILD" ]; then TAG="${VERSION}+${BUILD}"; else TAG="$VERSION"; fi
          echo "版本号 $VERSION / 构建号 $BUILD → tag $TAG"

          mkdir -p dist
          # 刻意不加 -maxdepth：万一以后某个 artifact 带了子目录，递归找出来
          # 至少会尝试上传；加了限制则是静默漏掉，更难发现。
          FILES=$(find dist -type f | sort)
          if [ -z "$FILES" ]; then
            echo "::error::dist/ 里没有任何产物，请确认至少有一个平台真的构建成功"
            exit 1
          fi
          echo "本次可发布的产物："
          echo "$FILES"

          # 先确保 Release 存在。已存在就复用 —— gh release create 撞上同名 tag
          # 会直接报错，不能无脑建。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，复用它并补齐缺失资产"
          else
            NOTES=$(printf 'Anima Editor %s\n\n- commit: %s\n' "$TAG" "$GITHUB_SHA")
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes "$NOTES"
            echo "已创建 Release $TAG"
          fi

          EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if [ -n "$EXISTING" ]; then echo "该 Release 上已有的资产："; echo "$EXISTING"; fi

          # 逐个判断重名。安卓 / iOS 的产物是工具链默认的通用名
          # （app-release.apk / Runner.ipa），挂到 Release 上看不出平台和版本，
          # 按其它平台的命名习惯改名后再传。
          upload=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *.apk) name="anima-editor-android-${VERSION}.apk" ;;
              *.ipa) name="anima-editor-ios-${VERSION}.ipa" ;;
              *)     name="$base" ;;
            esac
            # 用 here-string 而不是管道：pipefail 下 grep -q 提前退出可能让 printf
            # 收到 SIGPIPE，把「找到了」误判成「没找到」。
            if grep -Fxq -- "$name" <<< "$EXISTING"; then
              echo "跳过（同名资产已存在）：$name"
              continue
            fi
            if [ "$name" != "$base" ]; then
              cp "$f" "dist/$name"
              upload+=("dist/$name")
            else
              upload+=("$f")
            fi
          done <<< "$FILES"

          if [ ${#upload[@]} -eq 0 ]; then
            echo "::notice::所有资产都已存在，无需上传"
          else
            echo "上传 ${#upload[@]} 个新资产"
            gh release upload "$TAG" "${upload[@]}"
            echo "::notice::Release $TAG 已更新"
          fi
